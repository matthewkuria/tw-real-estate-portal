<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#18181b;">
  {% if preheader %}
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ preheader }}</div>
  {% endif %}
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border-radius:8px;">
          <tr>
            <td style="padding:24px 32px 8px; font-size:13px; color:#71717a;">{{ site_name }}</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px; font-size:16px; line-height:1.6;">
              {{ body_html|safe }}
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
          <tr>
            <td style="padding:16px 32px; font-size:12px; line-height:1.5; color:#71717a; text-align:center;">
              You're receiving this because you're a member of {{ site_name }}.<br>
              <a href="{{ unsubscribe_url }}" style="color:#71717a;">Unsubscribe</a>
              ·
              <a href="{{ archive_url }}" style="color:#71717a;">View in the portal</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
